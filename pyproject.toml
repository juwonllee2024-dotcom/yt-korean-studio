[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-korean-studio"
version = "0.1.0"
description = "Local Korean subtitle video studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pysubs2>=1.7,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp>=2025.1,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
fast = [
  "ctranslate2>=4.6,<5",
  "huggingface-hub>=0.30,<2",
  "sacremoses>=0.1,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
]

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]
exclude = ["tests*", "frontend*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
